<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Word Scramble — Puzzle</title>
<style>
/* ═══════════════════════════════════════════════════
   RESET & VARIABLES
   ═══════════════════════════════════════════════════ */
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}

:root{
  --bg:#1a120b;
  --panel:#241a10;
  --panel2:#2c2013;
  --border:#4a3620;
  --copper:#c17f3e;
  --copper2:#d99a55;
  --highlight:#e0a458;
  --gold:#e8b84b;
  --success:#8fae5d;
  --error:#c65d4a;
  --text:#f3e6d6;
  --dim:#a68a6c;
  --slot-empty:#5a4327;
  --slot-pulse:#7a5c34;
  --tile-shadow:#7a4d20;
}

html,body{
  height:100%;
  font-family:'Segoe UI',system-ui,-apple-system,sans-serif;
  background:var(--bg);
  color:var(--text);
  overflow-x:hidden;
}

/* ═══════════════════════════════════════════════════
   BACKGROUND GLOWS
   ═══════════════════════════════════════════════════ */
body::before,
body::after{
  content:'';
  position:fixed;
  border-radius:50%;
  pointer-events:none;
  z-index:0;
}
body::before{
  width:600px;height:600px;
  top:-180px;left:-120px;
  background:radial-gradient(circle,rgba(193,127,62,0.14) 0%,transparent 70%);
}
body::after{
  width:500px;height:500px;
  bottom:-200px;right:-100px;
  background:radial-gradient(circle,rgba(224,164,88,0.10) 0%,transparent 70%);
}

/* ═══════════════════════════════════════════════════
   LAYOUT
   ═══════════════════════════════════════════════════ */
.screen{
  position:relative;z-index:1;
  width:100%;max-width:440px;
  min-height:100dvh;
  margin:0 auto;
  padding:20px 18px 32px;
  display:flex;flex-direction:column;gap:18px;
}

/* ═══════════════════════════════════════════════════
   HEADER ROW  —  level badge + category + back
   ═══════════════════════════════════════════════════ */
.header{
  display:flex;align-items:center;justify-content:space-between;
}
.level-badge{
  background:linear-gradient(135deg,var(--copper),var(--copper2));
  color:#1a120b;
  font-size:12px;font-weight:800;letter-spacing:.5px;
  padding:5px 14px;border-radius:8px;
  text-transform:uppercase;
  box-shadow:0 2px 8px rgba(193,127,62,0.35);
}
.category-pill{
  font-size:12px;color:var(--dim);
  letter-spacing:.3px;
  text-transform:uppercase;
}
.back-btn{
  width:34px;height:34px;border-radius:10px;
  background:var(--panel);border:1px solid var(--border);
  color:var(--dim);font-size:16px;
  display:grid;place-items:center;cursor:pointer;
  transition:background .2s,border-color .2s;
}
.back-btn:hover{border-color:var(--copper);color:var(--text)}

/* ═══════════════════════════════════════════════════
   PROGRESS BAR
   ═══════════════════════════════════════════════════ */
.progress-track{
  width:100%;height:6px;border-radius:3px;
  background:var(--panel2);
  overflow:hidden;position:relative;
}
.progress-fill{
  height:100%;border-radius:3px;
  background:linear-gradient(90deg,var(--success),#a3c26a);
  width:35%;
  transition:width .5s cubic-bezier(.4,0,.2,1);
  position:relative;
}
/* shimmer sweep */
.progress-fill::after{
  content:'';position:absolute;
  top:0;left:-60%;width:60%;height:100%;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,0.25),transparent);
  animation:shimmer 2.2s ease-in-out infinite;
}
@keyframes shimmer{
  0%{left:-60%}
  100%{left:160%}
}

/* ═══════════════════════════════════════════════════
   STATS ROW
   ═══════════════════════════════════════════════════ */
.stats{
  display:flex;align-items:center;justify-content:space-between;
  font-size:13px;color:var(--dim);
}
.stats .stat{display:flex;align-items:center;gap:5px}
.stats .stat-icon{font-size:14px}
.stats .stat-val{font-weight:700;color:var(--text)}
.stats .coins-val{color:var(--gold)}
.stats .timer-val{
  font-size:15px;font-weight:800;
  color:var(--text);
  font-variant-numeric:tabular-nums;
}

/* ═══════════════════════════════════════════════════
   CLUE BOX
   ═══════════════════════════════════════════════════ */
.clue-box{
  background:linear-gradient(135deg,var(--panel),var(--panel2));
  border:1px solid var(--border);
  border-radius:14px;
  padding:14px 18px;
  text-align:center;
  font-size:14px;
  color:var(--highlight);
  line-height:1.5;
  position:relative;
  transition:border-color .4s,box-shadow .4s;
}
.clue-box .clue-label{
  font-size:10px;text-transform:uppercase;
  letter-spacing:1.2px;color:var(--dim);
  margin-bottom:4px;display:block;
}
/* correct glow */
.clue-box.glow-correct{
  border-color:var(--success);
  box-shadow:0 0 20px rgba(143,174,93,0.25),
             inset 0 0 12px rgba(143,174,93,0.08);
}

/* ═══════════════════════════════════════════════════
   ANSWER SLOTS
   ═══════════════════════════════════════════════════ */
.answer-area{
  display:flex;gap:10px;justify-content:center;
  padding:8px 0;
}
.slot{
  width:60px;height:64px;
  border-radius:12px;
  border:2px dashed var(--slot-empty);
  background:transparent;
  display:grid;place-items:center;
  font-size:26px;font-weight:800;
  color:var(--text);
  position:relative;
  cursor:pointer;
  transition:transform .15s,border-color .3s,background .3s,box-shadow .3s;
  animation:slotPulse 2.4s ease-in-out infinite;
}
.slot:nth-child(2){animation-delay:.3s}
.slot:nth-child(3){animation-delay:.6s}
.slot:nth-child(4){animation-delay:.9s}

@keyframes slotPulse{
  0%,100%{border-color:var(--slot-empty)}
  50%{border-color:var(--slot-pulse)}
}

/* filled state */
.slot.filled{
  border-style:solid;
  border-color:var(--copper);
  background:linear-gradient(160deg,rgba(193,127,62,0.12),rgba(217,154,85,0.08));
  box-shadow:0 0 14px rgba(193,127,62,0.18),
             inset 0 1px 0 rgba(255,255,255,0.06);
  animation:slotPop .4s cubic-bezier(.34,1.56,.64,1) forwards;
}
@keyframes slotPop{
  0%{transform:scale(0.55);opacity:.5}
  60%{transform:scale(1.12)}
  100%{transform:scale(1);opacity:1}
}

/* correct */
.slot.correct{
  border-color:var(--success)!important;
  background:linear-gradient(160deg,rgba(143,174,93,0.18),rgba(143,174,93,0.08))!important;
  box-shadow:0 0 18px rgba(143,174,93,0.3)!important;
  animation:none;
}
/* error shake */
.slot.shake{
  animation:slotShake .5s ease;
  border-color:var(--error)!important;
  background:rgba(198,93,74,0.12)!important;
}
@keyframes slotShake{
  0%,100%{transform:translateX(0)}
  15%{transform:translateX(-8px)}
  30%{transform:translateX(8px)}
  45%{transform:translateX(-6px)}
  60%{transform:translateX(6px)}
  75%{transform:translateX(-3px)}
  90%{transform:translateX(3px)}
}

/* ═══════════════════════════════════════════════════
   LETTER TILE RACK
   ═══════════════════════════════════════════════════ */
.tile-rack{
  display:flex;gap:10px;justify-content:center;
  padding:6px 0;
}
.tile{
  width:62px;height:66px;
  border-radius:14px;
  display:grid;place-items:center;
  font-size:24px;font-weight:800;
  color:#1a120b;
  cursor:pointer;
  user-select:none;
  position:relative;
  /* 3D embossed copper */
  background:linear-gradient(170deg,#d99a55 0%,#c17f3e 40%,#a5672c 100%);
  border:none;
  box-shadow:
    0 4px 0 var(--tile-shadow),
    0 6px 12px rgba(0,0,0,0.4),
    inset 0 1px 0 rgba(255,255,255,0.25),
    inset 0 -2px 0 rgba(0,0,0,0.15);
  transition:transform .1s,box-shadow .1s;
}
/* pressed / depression */
.tile:active,
.tile.pressed{
  transform:translateY(3px);
  box-shadow:
    0 1px 0 var(--tile-shadow),
    0 2px 6px rgba(0,0,0,0.3),
    inset 0 1px 0 rgba(255,255,255,0.2),
    inset 0 -1px 0 rgba(0,0,0,0.1);
}
/* used/disabled */
.tile.used{
  opacity:0.25;
  pointer-events:none;
  transform:scale(0.92);
  box-shadow:
    0 2px 0 rgba(0,0,0,0.2),
    0 2px 4px rgba(0,0,0,0.15);
}

/* tile entrance stagger */
.tile{animation:tileIn .35s cubic-bezier(.34,1.56,.64,1) both}
.tile:nth-child(1){animation-delay:0s}
.tile:nth-child(2){animation-delay:.06s}
.tile:nth-child(3){animation-delay:.12s}
.tile:nth-child(4){animation-delay:.18s}
@keyframes tileIn{
  0%{transform:scale(0) rotate(-12deg);opacity:0}
  100%{transform:scale(1) rotate(0);opacity:1}
}

/* shuffle spin */
.tile.spin{animation:tileSpin .4s ease}
@keyframes tileSpin{
  0%{transform:rotateY(0)}
  100%{transform:rotateY(360deg)}
}

/* ═══════════════════════════════════════════════════
   ACTION BUTTONS
   ═══════════════════════════════════════════════════ */
.actions{
  display:flex;gap:8px;justify-content:center;
}
.act-btn{
  display:flex;align-items:center;gap:6px;
  padding:10px 18px;border-radius:12px;
  font-size:13px;font-weight:600;
  cursor:pointer;border:none;
  transition:background .2s,border-color .2s,opacity .2s,transform .15s;
}
.act-btn:active{transform:scale(0.95)}
.act-btn:disabled{opacity:0.35;cursor:not-allowed;transform:none}

/* shuffle */
.act-btn.shuffle{
  background:var(--panel);border:1px solid var(--border);
  color:var(--text);
}
.act-btn.shuffle:hover:not(:disabled){border-color:var(--copper)}
.act-btn.shuffle .icon{transition:transform .4s;display:inline-block}
.act-btn.shuffle.spinning .icon{transform:rotate(360deg)}

/* hint */
.act-btn.hint{
  background:linear-gradient(135deg,rgba(232,184,75,0.18),rgba(232,184,75,0.08));
  border:1px solid rgba(232,184,75,0.35);
  color:var(--gold);
}
.act-btn.hint:hover:not(:disabled){background:linear-gradient(135deg,rgba(232,184,75,0.28),rgba(232,184,75,0.14))}
.act-btn.hint .cost{
  font-size:10px;opacity:.7;
}
.act-btn.hint:disabled{color:var(--dim);border-color:var(--border)}

/* clear */
.act-btn.clear{
  background:transparent;border:1px solid transparent;
  color:var(--error);opacity:.7;
}
.act-btn.clear:hover:not(:disabled){opacity:1}
.act-btn.clear:disabled{opacity:.25}

/* ═══════════════════════════════════════════════════
   TOAST
   ═══════════════════════════════════════════════════ */
.toast{
  position:fixed;
  bottom:80px;left:50%;
  transform:translateX(-50%) translateY(20px);
  padding:12px 24px;border-radius:12px;
  font-size:14px;font-weight:700;
  pointer-events:none;
  opacity:0;
  z-index:100;
  transition:opacity .3s,transform .3s;
  white-space:nowrap;
}
.toast.show{
  opacity:1;
  transform:translateX(-50%) translateY(0);
}
.toast.success{
  background:linear-gradient(135deg,rgba(143,174,93,0.22),rgba(143,174,93,0.12));
  border:1px solid rgba(143,174,93,0.4);
  color:var(--success);
}
.toast.error{
  background:linear-gradient(135deg,rgba(198,93,74,0.22),rgba(198,93,74,0.12));
  border:1px solid rgba(198,93,74,0.4);
  color:var(--error);
}

/* ═══════════════════════════════════════════════════
   WORD LENGTH HINT (letter count dots)
   ═══════════════════════════════════════════════════ */
.length-dots{
  display:flex;gap:6px;justify-content:center;
  margin-top:2px;
}
.length-dots .dot{
  width:5px;height:5px;border-radius:50%;
  background:var(--border);
  transition:background .3s;
}
.length-dots .dot.filled{background:var(--copper)}

/* ═══════════════════════════════════════════════════
   RESPONSIVE
   ═══════════════════════════════════════════════════ */
@media(max-width:380px){
  .slot{width:52px;height:56px;font-size:22px}
  .tile{width:56px;height:60px;font-size:21px}
  .answer-area{gap:8px}
  .tile-rack{gap:8px}
}
</style>
</head>
<body>

<div class="screen" id="app">
  <!-- HEADER -->
  <div class="header">
    <div class="back-btn" onclick="goHome()">←</div>
    <div style="text-align:center">
      <div class="level-badge">Level 2</div>
    </div>
    <div class="category-pill">Nature</div>
  </div>

  <!-- PROGRESS -->
  <div class="progress-track">
    <div class="progress-fill" id="progressFill"></div>
  </div>

  <!-- STATS -->
  <div class="stats">
    <div class="stat">
      <span class="stat-icon">⭐</span>
      <span class="stat-val" id="scoreVal">0</span>
    </div>
    <div class="stat timer-val" id="timerVal">:55</div>
    <div class="stat">
      <span class="stat-icon">🪙</span>
      <span class="stat-val coins-val" id="coinsVal">12</span>
    </div>
  </div>

  <!-- CLUE -->
  <div class="clue-box" id="clueBox">
    <span class="clue-label">Clue</span>
    It twinkles in the night sky
  </div>

  <!-- ANSWER SLOTS -->
  <div class="answer-area" id="answerArea">
    <div class="slot" data-idx="0" onclick="removeFromSlot(0)"></div>
    <div class="slot" data-idx="1" onclick="removeFromSlot(1)"></div>
    <div class="slot" data-idx="2" onclick="removeFromSlot(2)"></div>
    <div class="slot" data-idx="3" onclick="removeFromSlot(3)"></div>
  </div>

  <!-- LENGTH DOTS -->
  <div class="length-dots" id="lengthDots">
    <div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div>
  </div>

  <!-- TILE RACK -->
  <div class="tile-rack" id="tileRack"></div>

  <!-- ACTIONS -->
  <div class="actions">
    <button class="act-btn shuffle" id="shuffleBtn" onclick="doShuffle()">
      <span class="icon">🔀</span> Shuffle
    </button>
    <button class="act-btn hint" id="hintBtn" onclick="doHint()">
      💡 Hint <span class="cost">(3🪙)</span>
    </button>
    <button class="act-btn clear" id="clearBtn" onclick="doClear()" disabled>
      ✕ Clear
    </button>
  </div>
</div>

<!-- TOAST -->
<div class="toast" id="toast"></div>

<script>
// ═══════════════════════════════════════════════════
// STATE
// ═══════════════════════════════════════════════════
const ANSWER = 'STAR';
const CLUE   = 'It twinkles in the night sky';
const TILES  = ['T','R','A','S'];

let placed   = new Array(ANSWER.length).fill(null); // letter in each slot
let rackUsed = new Array(TILES.length).fill(false);  // which rack tiles are used
let score    = 0;
let coins    = 12;
let stars    = 0;
let timeLeft = 55;
let timer    = null;
let checking = false;

// ═══════════════════════════════════════════════════
// INIT
// ═══════════════════════════════════════════════════
function init(){
  renderTiles();
  startTimer();
  updateUI();
}

// ═══════════════════════════════════════════════════
// RENDER TILES
// ═══════════════════════════════════════════════════
function renderTiles(){
  const rack = document.getElementById('tileRack');
  rack.innerHTML = '';
  TILES.forEach((ch, i) => {
    const t = document.createElement('div');
    t.className = 'tile' + (rackUsed[i] ? ' used' : '');
    t.textContent = ch;
    t.dataset.idx = i;
    t.addEventListener('click', () => placeLetter(i));
    // press feedback
    t.addEventListener('mousedown', () => t.classList.add('pressed'));
    t.addEventListener('mouseup',   () => t.classList.remove('pressed'));
    t.addEventListener('mouseleave',() => t.classList.remove('pressed'));
    t.addEventListener('touchstart', () => t.classList.add('pressed'), {passive:true});
    t.addEventListener('touchend',   () => t.classList.remove('pressed'));
    rack.appendChild(t);
  });
}

// ═══════════════════════════════════════════════════
// PLACE LETTER  →  tile → next empty slot
// ═══════════════════════════════════════════════════
function placeLetter(rackIdx){
  if(checking || rackUsed[rackIdx]) return;
  const slotIdx = placed.indexOf(null);
  if(slotIdx === -1) return;

  placed[slotIdx] = { letter: TILES[rackIdx], rackIdx };
  rackUsed[rackIdx] = true;

  const slot = document.querySelectorAll('.slot')[slotIdx];
  slot.textContent = TILES[rackIdx];
  slot.classList.add('filled');

  // update dots
  updateDots();
  updateClearBtn();
  renderTiles();

  // check if full
  if(!placed.includes(null)){
    checkAnswer();
  }
}

// ═══════════════════════════════════════════════════
// REMOVE FROM SLOT  →  slot → back to rack
// ═══════════════════════════════════════════════════
function removeFromSlot(slotIdx){
  if(checking || !placed[slotIdx]) return;
  const data = placed[slotIdx];

  const slot = document.querySelectorAll('.slot')[slotIdx];
  slot.textContent = '';
  slot.classList.remove('filled','correct','shake');

  rackUsed[data.rackIdx] = false;
  placed[slotIdx] = null;

  updateDots();
  updateClearBtn();
  renderTiles();
}

// ═══════════════════════════════════════════════════
// CHECK ANSWER
// ═══════════════════════════════════════════════════
function checkAnswer(){
  checking = true;
  const attempt = placed.map(p => p ? p.letter : '').join('');

  if(attempt === ANSWER){
    // ——— CORRECT ———
    clearInterval(timer);
    score += 20;
    stars = Math.min(3, stars + 1);

    const slots = document.querySelectorAll('.slot');
    slots.forEach((s,i) => {
      setTimeout(() => s.classList.add('correct'), i * 100);
    });
    document.getElementById('clueBox').classList.add('glow-correct');

    showToast('Correct! +20 score, +1 star ⭐', 'success');
    playTone(523, 0.12);
    setTimeout(() => playTone(659, 0.12), 100);
    setTimeout(() => playTone(784, 0.2), 200);
    updateUI();
  } else {
    // ——— WRONG ———
    const slots = document.querySelectorAll('.slot');
    slots.forEach(s => s.classList.add('shake'));
    playTone(220, 0.2, 'sawtooth');
    showToast('Try again!', 'error');

    setTimeout(() => {
      slots.forEach((s,i) => {
        s.classList.remove('shake','filled');
        s.textContent = '';
        placed[i] = null;
      });
      rackUsed = rackUsed.map(() => false);
      renderTiles();
      updateDots();
      updateClearBtn();
      checking = false;
    }, 700);
  }
}

// ═══════════════════════════════════════════════════
// SHUFFLE
// ═══════════════════════════════════════════════════
function doShuffle(){
  const btn = document.getElementById('shuffleBtn');
  btn.classList.add('spinning');
  setTimeout(() => btn.classList.remove('spinning'), 450);
  playTone(440, 0.08);

  // Fisher-Yates on rack
  for(let i = TILES.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [TILES[i], TILES[j]] = [TILES[j], TILES[i]];
    [rackUsed[i], rackUsed[j]] = [rackUsed[j], rackUsed[i]];
  }
  // reset placed if any
  if(placed.some(p => p)){
    placed = new Array(ANSWER.length).fill(null);
    rackUsed = rackUsed.map(() => false);
    document.querySelectorAll('.slot').forEach(s => {
      s.textContent = '';
      s.classList.remove('filled','correct','shake');
    });
    updateDots();
  }
  renderTiles();
}

// ═══════════════════════════════════════════════════
// HINT  → reveal one correct letter
// ═══════════════════════════════════════════════════
function doHint(){
  if(coins < 3 || checking) return;
  coins -= 3;

  // find first incorrect slot
  let target = -1;
  for(let i = 0; i < ANSWER.length; i++){
    if(!placed[i] || placed[i].letter !== ANSWER[i]){
      target = i;
      break;
    }
  }
  if(target === -1){ updateUI(); return; }

  const needed = ANSWER[target];

  // clear current slot if filled
  if(placed[target]){
    removeFromSlot(target);
  }

  // find unused rack tile with needed letter
  for(let i = 0; i < TILES.length; i++){
    if(!rackUsed[i] && TILES[i] === needed){
      placeLetter(i);
      break;
    }
  }
  playTone(880, 0.1);
  updateUI();
}

// ═══════════════════════════════════════════════════
// CLEAR
// ═══════════════════════════════════════════════════
function doClear(){
  if(checking) return;
  placed = new Array(ANSWER.length).fill(null);
  rackUsed = rackUsed.map(() => false);
  document.querySelectorAll('.slot').forEach(s => {
    s.textContent = '';
    s.classList.remove('filled','correct','shake');
  });
  renderTiles();
  updateDots();
  updateClearBtn();
  playTone(330, 0.06);
}

// ═══════════════════════════════════════════════════
// TIMER
// ═══════════════════════════════════════════════════
function startTimer(){
  clearInterval(timer);
  timer = setInterval(() => {
    timeLeft--;
    document.getElementById('timerVal').textContent = ':' + String(timeLeft).padStart(2,'0');
    if(timeLeft <= 0){
      clearInterval(timer);
      showToast('Time\'s up!', 'error');
    }
  }, 1000);
}

// ═══════════════════════════════════════════════════
// UI HELPERS
// ═══════════════════════════════════════════════════
function updateUI(){
  document.getElementById('scoreVal').textContent = score;
  document.getElementById('coinsVal').textContent = coins;
  document.getElementById('timerVal').textContent = ':' + String(timeLeft).padStart(2,'0');
  const pct = (score / 100) * 100;
  document.getElementById('progressFill').style.width = Math.min(pct, 100) + '%';
  updateHintBtn();
}

function updateClearBtn(){
  document.getElementById('clearBtn').disabled = !placed.some(p => p);
}

function updateDots(){
  const dots = document.querySelectorAll('.length-dots .dot');
  dots.forEach((d,i) => {
    d.classList.toggle('filled', placed[i] !== null);
  });
}

function updateHintBtn(){
  document.getElementById('hintBtn').disabled = coins < 3;
}

function showToast(msg, type){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast ' + type;
  requestAnimationFrame(() => t.classList.add('show'));
  setTimeout(() => t.classList.remove('show'), 2000);
}

function goHome(){
  playTone(330, 0.06);
}

// ═══════════════════════════════════════════════════
// SOUND
// ═══════════════════════════════════════════════════
let actx;
function playTone(freq, dur, type='sine'){
  try {
    if(!actx) actx = new (window.AudioContext||window.webkitAudioContext)();
    const o = actx.createOscillator();
    const g = actx.createGain();
    o.type = type;
    o.frequency.value = freq;
    g.gain.setValueAtTime(0.12, actx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, actx.currentTime + dur);
    o.connect(g); g.connect(actx.destination);
    o.start(); o.stop(actx.currentTime + dur);
  } catch(e){}
}

// ═══════════════════════════════════════════════════
// BOOT
// ═══════════════════════════════════════════════════
init();
</script>
