<!DOCTYPE html>
<html lang="en">
<head>
    <script>
      const __originalFetch = window.fetch;
      window.fetch = async function() {
        let url = arguments[0];
        if (typeof url === 'string' && url.includes('/quiz') && url.includes('projects')) {
            const api = new URLSearchParams(window.location.search).get("api");
            const slug = new URLSearchParams(window.location.search).get("slug");
            if (api && slug) {
                arguments[0] = api.replace(/\/+$/, '') + "/api/public/projects/" + slug + "/quiz";
            }
        }
        
        const response = await __originalFetch.apply(this, arguments);
        const clone = response.clone();
        
        response.json = async function() {
            const data = await clone.json();
            if (data && data.data && Array.isArray(data.data)) {
                data.data.forEach(q => {
                    if (Array.isArray(q.options)) q.options.sort(() => Math.random() - 0.5);
                });
            } else if (Array.isArray(data)) {
                data.forEach(q => {
                    if (Array.isArray(q.options)) q.options.sort(() => Math.random() - 0.5);
                });
            }
            return data;
        };
        return response;
      };
    </script>
    

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
  <title>PicWord - Guess the Word</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div id="app">
    <!-- ===== HOMEPAGE ===== -->
    <div class="screen active" id="homeScreen">
      <div class="home-bg"></div>
      <div class="home-content">
        <button class="play-btn" id="playBtn">
          <span>PLAY</span>
        </button>
      </div>
    </div>

    <!-- ===== GAME SCREEN ===== -->
    <div class="screen" id="gameScreenWrapper">
      <div class="game-bg"></div>
      <header class="top-bar">
        <div class="top-bar-left">
          <button class="icon-btn" id="settingsBtn" aria-label="Settings">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="12" cy="12" r="3"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/>
            </svg>
          </button>
          <button class="icon-btn" id="menuBtn" aria-label="Menu">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
              <line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/>
            </svg>
          </button>
        </div>
        <div class="top-bar-center">
          <h1 class="level-title" id="levelTitle">Level 1</h1>
        </div>
        <div class="top-bar-right">
          <div class="stat-pill">
            <span class="stat-icon">⭐</span>
            <span class="stat-val" id="scoreCount">0</span>
          </div>
        </div>
      </header>

      <main class="game-main">
        <div class="game-area">
          <!-- LEFT PANEL: Image + Hint + Word Slots -->
          <div class="left-panel">
            <div class="puzzle-card">
              <div class="puzzle-emoji" id="puzzleEmoji">🧊</div>
              <div class="puzzle-question" id="puzzleQuestion"></div>
              <div class="puzzle-hint-label">Hint:</div>
              <div class="puzzle-hint" id="puzzleHint">ICE + ___</div>
              <div class="answer-slots" id="answerSlots"></div>
            </div>
          </div>

          <!-- RIGHT PANEL: QWERTY Keyboard -->
          <div class="right-panel">
            <div class="keyboard" id="keyboard"></div>
          </div>
        </div>
      </main>
    </div>

    <!-- ===== MODALS ===== -->
    <div class="modal-overlay" id="settingsModal">
      <div class="modal-card">
        <div class="modal-header">
          <h2>Settings</h2>
          <button class="close-btn" id="closeSettings">&times;</button>
        </div>
        <div class="modal-body">
          <div class="setting-row">
            <span>Sound Effects</span>
            <label class="toggle">
              <input type="checkbox" id="soundToggle" checked>
              <span class="toggle-slider"></span>
            </label>
          </div>
          <div class="setting-row center">
            <button class="settings-action-btn" id="resetProgress">Reset Progress</button>
          </div>
        </div>
      </div>
    </div>

    <div class="modal-overlay" id="menuModal">
      <div class="modal-card">
        <div class="modal-header">
          <h2>Levels</h2>
          <button class="close-btn" id="closeMenu">&times;</button>
        </div>
        <div class="modal-body level-select" id="levelSelect"></div>
      </div>
    </div>

    <div class="feedback" id="correctFeedback"><span>✅</span></div>
    <div class="feedback" id="wrongFeedback"><span>❌</span></div>
  </div>

  <script src="js/levels.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/game.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
