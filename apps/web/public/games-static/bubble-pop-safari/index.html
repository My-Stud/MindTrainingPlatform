<!DOCTYPE html>
<html lang="en">
<head>
    <script>
      const __originalFetch = window.fetch;
      window.fetch = async function() {
        let url = arguments[0];
        if (typeof url === 'string' && url.includes('/quiz') && url.includes('projects')) {
            const api = new URLSearchParams(window.location.search).get("api");
            const slug = new URLSearchParams(window.location.search).get("slug");
            if (api && slug) {
                arguments[0] = api.replace(/\/+$/, '') + "/api/public/projects/" + slug + "/quiz";
            }
        }
        
        const response = await __originalFetch.apply(this, arguments);
        const clone = response.clone();
        
        response.json = async function() {
            const data = await clone.json();
            if (data && data.data && Array.isArray(data.data)) {
                data.data.forEach(q => {
                    if (Array.isArray(q.options)) q.options.sort(() => Math.random() - 0.5);
                });
            } else if (Array.isArray(data)) {
                data.forEach(q => {
                    if (Array.isArray(q.options)) q.options.sort(() => Math.random() - 0.5);
                });
            }
            return data;
        };
        return response;
      };
    </script>
    

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Bubble Pop Safari</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Fredoka:wght@500;600;700&family=Lilita+One&family=Nunito:wght@800;900&family=Luckiest+Guy&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <canvas id="gameCanvas"></canvas>
  <script src="game.js?v=11"></script>
</body>
</html>
